name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # tag push 时为 v3.1.3；workflow_dispatch 时为默认分支名。build_windows.py 自动剥 v 前缀。
  SOFTHERTZ_VERSION: ${{ github.ref_name }}

jobs:
  test-python:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            constraints: packaging/constraints-test-py39.txt
          - python-version: '3.11.9'
            constraints: packaging/constraints-windows-py311.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ${{ matrix.constraints }}

      - name: Install dependencies
        env:
          PIP_CONSTRAINT: ${{ matrix.constraints }}
        run: python -m pip install --editable ".[dev]"

      - name: Run formal tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build-windows:
    needs: test-python
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints-windows-py311.txt

      - name: Install dependencies
        env:
          PIP_CONSTRAINT: packaging/constraints-windows-py311.txt
        run: python -m pip install --editable ".[dev]"

      - name: Run formal tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build EXE (PyInstaller)
        run: python packaging/build_windows.py

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem ".\dist\SoftHertz_Tool-*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "未找到 dist\SoftHertz_Tool-*.exe 构建产物"
          }
          $process = Start-Process `
            -FilePath $exe.FullName `
            -ArgumentList "--smoke" `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "$($exe.Name) --smoke timed out after 30 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "$($exe.Name) --smoke exited with code $($process.ExitCode)"
          }
          Write-Host "smoke OK: $($exe.Name)"

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem ".\dist\SoftHertz_Tool-*.exe" | Select-Object -First 1
          $hash = (Get-FileHash `
            -Path $exe.FullName `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" |
            Set-Content `
              -Path "$($exe.FullName).sha256" `
              -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftHertz_Tool-windows
          path: dist/SoftHertz_Tool-*.exe*
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SoftHertz_Tool-*.exe*
